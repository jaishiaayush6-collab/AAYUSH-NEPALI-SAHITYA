<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>कथा संसार | AJ नेपाली साहित्य</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#f5f3ff;
  --surface:#ffffff;
  --text:#252044;
  --muted:#77718d;
  --primary:#7652d8;
  --secondary:#ed70b7;
  --border:#e9e3fa;
  --shadow:0 12px 35px rgba(70,45,120,.10);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Noto Sans Devanagari',sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.3s;
}

body.dark{
  --bg:#111326;
  --surface:#1c2038;
  --text:#f4f1ff;
  --muted:#b7b1d0;
  --border:#343653;
  --shadow:0 12px 35px rgba(0,0,0,.25);
}

body.blue{
  --bg:#edf5ff;--primary:#2875d8;--secondary:#51b8e9;
  --text:#17345b;--surface:#fff;--border:#d8e9fc;
}

body.nightblue{
  --bg:#0b1830;--surface:#142747;--text:#eef5ff;
  --muted:#a9bfdc;--primary:#5595ef;--secondary:#55c5ed;
  --border:#294366;
}

body.sky{
  --bg:#eafaff;--surface:#fff;--text:#17445b;
  --primary:#269fc9;--secondary:#65d5e9;--border:#d3f0f7;
}

body.pink{
  --bg:#fff0f7;--surface:#fff;--text:#632c4d;
  --primary:#e65b9b;--secondary:#f6a3c9;--border:#f9d9e9;
}

body.skypink{
  --bg:#f8f2ff;--surface:#fff;--text:#49335f;
  --primary:#9b6be0;--secondary:#f28dbd;--border:#eadcf9;
}

body.green{
  --bg:#effaf2;--surface:#fff;--text:#244b35;
  --primary:#299b62;--secondary:#82cf9e;--border:#d8efdf;
}

body.sunset{
  --bg:#fff4eb;--surface:#fff;--text:#613b2c;
  --primary:#e47a43;--secondary:#f4b36b;--border:#f8e1ce;
}

/* HEADER */

.hero{
  position:relative;
  overflow:hidden;
  padding:32px 18px 35px;
  color:white;
  text-align:center;
  background:linear-gradient(125deg,#30206e,#7652d8,#d45aaf);
  border-radius:0 0 32px 32px;
  box-shadow:0 15px 40px rgba(91,55,160,.25);
}

.hero:before,.hero:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.09);
}

.hero:before{
  width:230px;height:230px;
  top:-130px;left:-50px;
}

.hero:after{
  width:190px;height:190px;
  bottom:-130px;right:-30px;
}

.brand{
  position:relative;
  z-index:1;
  font-size:14px;
  letter-spacing:2px;
  font-weight:700;
  opacity:.95;
}

.hero h1{
  position:relative;
  z-index:1;
  margin:12px 0 8px;
  font-size:clamp(35px,7vw,58px);
  font-weight:800;
  letter-spacing:1px;
  text-shadow:0 5px 15px rgba(0,0,0,.2);
}

.hero p{
  position:relative;
  z-index:1;
  margin:0;
  font-size:15px;
  line-height:1.9;
  opacity:.95;
}

.hero-line{
  width:75px;
  height:4px;
  border-radius:20px;
  background:#ffd5ef;
  margin:15px auto 0;
}

/* THEME PICKER */

.theme-area{
  display:flex;
  justify-content:flex-end;
  max-width:1150px;
  margin:15px auto 0;
  padding:0 16px;
}

.theme-box{position:relative}

.theme-toggle{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:30px;
  padding:8px 13px;
  font-family:inherit;
  font-size:12px;
  cursor:pointer;
  box-shadow:var(--shadow);
}

.theme-options{
  display:none;
  position:absolute;
  z-index:20;
  right:0;
  top:42px;
  width:210px;
  padding:12px;
  border-radius:15px;
  background:var(--surface);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
}

.theme-options.show{display:block}

.theme-options h4{
  margin:2px 0 10px;
  font-size:13px;
}

.theme-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.theme-choice{
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  padding:8px 5px;
  border-radius:9px;
  font-family:inherit;
  font-size:11px;
  cursor:pointer;
}

.theme-choice:hover{border-color:var(--primary)}

/* MAIN */

.container{
  max-width:1150px;
  margin:auto;
  padding:20px 16px 50px;
}

.intro{
  text-align:center;
  margin:15px 0 25px;
}

.intro h2{
  font-size:23px;
  margin:0 0 7px;
}

.intro p{
  color:var(--muted);
  font-size:13px;
  margin:0;
}

/* SEARCH */

.search-row{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.search-row input{
  flex:1;
  min-width:0;
  padding:14px 17px;
  border:1px solid var(--border);
  border-radius:14px;
  outline:none;
  background:var(--surface);
  color:var(--text);
  font-family:inherit;
  font-size:14px;
  box-shadow:var(--shadow);
}

.search-row input:focus{
  border-color:var(--primary);
}

.fav-button{
  border:0;
  padding:0 17px;
  border-radius:13px;
  background:linear-gradient(120deg,var(--primary),var(--secondary));
  color:white;
  font-family:inherit;
  cursor:pointer;
  white-space:nowrap;
}

/* CATEGORY */

.category-title{
  font-size:17px;
  margin:22px 0 12px;
}

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:3px 2px 13px;
  scrollbar-width:thin;
}

.cat-btn{
  flex-shrink:0;
  padding:10px 15px;
  border:1px solid var(--border);
  border-radius:25px;
  background:var(--surface);
  color:var(--text);
  font-family:inherit;
  font-size:12px;
  cursor:pointer;
  transition:.2s;
}

.cat-btn.active,.cat-btn:hover{
  background:linear-gradient(120deg,var(--primary),var(--secondary));
  color:white;
  border-color:transparent;
}

/* STORY CARDS */

.story-count{
  color:var(--muted);
  font-size:12px;
  margin:10px 0 15px;
}

.story-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:16px;
}

.story-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:17px;
  padding:18px;
  box-shadow:var(--shadow);
  transition:.25s;
}

.story-card:hover{
  transform:translateY(-4px);
}

.story-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.story-category{
  font-size:11px;
  color:var(--primary);
  background:var(--bg);
  padding:6px 10px;
  border-radius:20px;
}

.heart{
  border:0;
  background:transparent;
  font-size:22px;
  cursor:pointer;
}

.story-card h3{
  font-size:17px;
  margin:13px 0 9px;
}

.story-card p{
  color:var(--muted);
  font-size:13px;
  line-height:2;
  margin:0;
  display:-webkit-box;
  -webkit-line-clamp:5;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.read-btn{
  margin-top:15px;
  width:100%;
  padding:10px;
  border:0;
  border-radius:10px;
  background:linear-gradient(120deg,var(--primary),var(--secondary));
  color:white;
  font-family:inherit;
  cursor:pointer;
}

/* FULL STORY MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(10,8,25,.75);
  padding:15px;
  overflow-y:auto;
}

.modal.show{
  display:flex;
  align-items:flex-start;
  justify-content:center;
}

.modal-content{
  width:100%;
  max-width:780px;
  margin:25px auto;
  background:var(--surface);
  color:var(--text);
  border-radius:20px;
  padding:25px;
  box-shadow:0 20px 70px rgba(0,0,0,.3);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding-bottom:16px;
  border-bottom:2px solid var(--border);
}

.modal-header h2{
  font-size:21px;
  margin:0;
  line-height:1.7;
  color:var(--primary);
}

.close{
  border:0;
  background:var(--bg);
  color:var(--text);
  width:35px;
  height:35px;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
  flex-shrink:0;
}

.full-story{
  font-size:15px;
  line-height:2.25;
  white-space:pre-line;
  margin-top:20px;
  color:var(--text);
  text-align:justify;
  padding:20px;
  border:1px solid var(--border);
  border-radius:15px;
  background:var(--bg);
  box-shadow:var(--shadow);
}

footer{
  text-align:center;
  padding:22px;
  color:var(--muted);
  font-size:12px;
  border-top:1px solid var(--border);
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:35px 10px;
  grid-column:1/-1;
}

@media(max-width:600px){
  .hero{padding:27px 15px 30px}
  .hero p{font-size:13px}
  .search-row{flex-wrap:wrap}
  .search-row input{width:100%;flex-basis:100%}
  .fav-button{padding:11px 15px}
  .modal-content{padding:18px}
  .full-story{padding:14px;font-size:14px}
}
</style>
</head>

<body>

<header class="hero">
  <div class="brand">📚 AJ नेपाली साहित्य</div>
  <h1>कथा संसार</h1>
  <p>नेपाली कथा साहित्य र लोककथाको सुन्दर संसार<br>
  पढौँ • सिकौँ • सिर्जना गरौँ</p>
  <div class="hero-line"></div>
</header>

<div class="theme-area">
  <div class="theme-box">
    <button class="theme-toggle" onclick="toggleThemes()">
      🎨 मन पर्ने डिजाइन छान्नुहोस्
    </button>

    <div class="theme-options" id="themeOptions">
      <h4>✨ आफ्नो थिम छान्नुहोस्</h4>
      <div class="theme-grid">
        <button class="theme-choice" onclick="setTheme('')">💜 Purple</button>
        <button class="theme-choice" onclick="setTheme('dark')">🌙 Dark</button>
        <button class="theme-choice" onclick="setTheme('blue')">💙 Blue</button>
        <button class="theme-choice" onclick="setTheme('nightblue')">🌌 Dark Blue</button>
        <button class="theme-choice" onclick="setTheme('sky')">🩵 Sky Blue</button>
        <button class="theme-choice" onclick="setTheme('pink')">🌸 Pink</button>
        <button class="theme-choice" onclick="setTheme('skypink')">🩷 Sky Pink</button>
        <button class="theme-choice" onclick="setTheme('green')">🌿 Green</button>
        <button class="theme-choice" onclick="setTheme('sunset')">🌅 Sunset</button>
      </div>
    </div>
  </div>
</div>

<main class="container">

  <section class="intro">
    <h2>📖 नेपाली कथाहरूको संग्रह</h2>
    <p>विभिन्न विधाका कथा पढ्नुहोस्, मन परेका कथा सुरक्षित राख्नुहोस्।</p>
  </section>

  <div class="search-row">
    <input id="searchInput" type="search"
      placeholder="🔍 कथाको नाम वा शब्द खोज्नुहोस्..."
      oninput="renderStories()">

    <button class="fav-button" onclick="showFavorites()">
      ❤️ मन परेका कथा
    </button>
  </div>

  <h3 class="category-title">📚 कथा विधाहरू</h3>
  <div class="categories" id="categories"></div>

  <div class="story-count" id="storyCount"></div>
  <div class="story-grid" id="storyGrid"></div>

</main>

<div class="modal" id="storyModal" onclick="closeOutside(event)">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div class="full-story" id="modalStory"></div>
  </div>
</div>

<footer>
  © AJ नेपाली साहित्य | कथा संसार 📚<br>
  पढौँ • सिकौँ • सिर्जना गरौँ
</footer>

<script>

const categories = [
"बाल कथा",
"प्रेम कथा",
"प्रेरणादायी कथा",
"भूत प्रेत कथा",
"वैज्ञानिक कथा",
"धार्मिक कथा",
"ऐतिहासिक कथा",
"जनावरका कथा",
"गाउँघरका कथा",
"सामाजिक कथा",
"हास्य कथा",
"राजकुमार–राजकुमारीका कथा",
"विज्ञान तथा प्रविधि कथा",
"काल्पनिक कथा",
"नैतिक कथा",
"शिक्षामूलक कथा",
"इमानदार कथा",
"लभ स्टोरी सम्बन्धी कथा"
];

const samples = [

{
title:"सानो प्रयासको ठूलो परिणाम",

intro:`हरियाली डाँडाले घेरिएको एउटा सुन्दर गाउँ थियो। गाउँको नाम शान्तिपुर थियो। त्यहाँका मानिसहरू मेहनती र मिलनसार थिए। गाउँमा प्राकृतिक सुन्दरता प्रशस्त भए पनि केही समस्या वर्षौँदेखि जस्ताको तस्तै थिए। वर्षायाममा बाटो हिलाम्मे हुन्थ्यो, खानेपानीको मुहान फोहोर हुँदै गएको थियो र विद्यालय टाढा भएकाले साना बालबालिकालाई पढ्न कठिन पर्थ्यो।

यही गाउँमा आर्यन नामको एक जिज्ञासु र मेहनती बालक बस्थ्यो। ऊ कक्षा आठमा पढ्थ्यो। आर्यनलाई आफ्नो गाउँ असाध्यै प्यारो लाग्थ्यो। विद्यालयबाट घर फर्कँदा ऊ बाटोमा देखिएका समस्या ध्यानपूर्वक हेर्थ्यो। उसलाई सधैँ लाग्थ्यो—आफ्नो गाउँलाई अझ राम्रो बनाउन केही गर्नुपर्छ।`,

middle:`एक दिन विद्यालयबाट फर्कँदै गर्दा उसले पानीको मुहान वरिपरि प्लास्टिकका झोला, बोतल र अन्य फोहोर देख्यो। पानी लिन आएका वृद्ध मानिसहरूलाई पनि निकै कठिन भइरहेको थियो। उसले आफ्नी आमालाई यसबारे सुनायो।

आमाले भनिन्, “छोरा, परिवर्तन चाहनेले अरूलाई दोष दिनुभन्दा आफूबाट सुरु गर्नुपर्छ।”

आमाको कुरा आर्यनको मनमा गहिरो गरी बस्यो।

भोलिपल्ट उसले आफ्ना तीन जना साथी—सुमन, निशा र विवेकलाई विद्यालयपछि भेट्न बोलायो। उसले गाउँ सफा गर्ने र साना बालबालिकालाई पढाइमा सहयोग गर्ने योजना सुनायो।

सुमनले भन्यो, “हामी चार जनाले मात्रै के गर्न सक्छौँ र?”

आर्यनले मुस्कुराउँदै भन्यो, “हामीले सबै समस्या एकै दिनमा समाधान गर्नुपर्दैन। आज एउटा सानो काम गरौँ, भोलि अर्को काम थपौँ।”

शनिबार बिहान उनीहरू पन्जा, झोला र सरसफाइका सामान्य सामग्री लिएर पानीको मुहानतिर गए। उनीहरूले वरिपरि छरिएका फोहोर संकलन गरे। कुहिने र नकुहिने फोहोर अलग राखे। मुहान वरिपरि सफा गरे र गाउँका ठूलाबडासँग सुरक्षित घेराबार बनाउने सल्लाह मागे।

काम गर्दै गर्दा केही मानिसले उनीहरूलाई हेरेर भने, “यति सानो कामले गाउँ बदलिन्छ र?”

तर उनीहरूले जवाफमा बहस गरेनन्। आफ्नो काम निरन्तर गरिरहे।

अर्को हप्ता उनीहरूले विद्यालयको खाली कोठामा पढाइमा कमजोर बालबालिकाका लागि एक घण्टाको निःशुल्क अध्ययन समूह सुरु गरे। निशाले नेपाली पढाउन थाली, सुमनले गणितका सजिला अभ्यास गराउन थाल्यो र विवेकले चित्र बनाएर विज्ञानका विषय बुझाउन सहयोग गर्‍यो।

केही दिनमै साना बालबालिका उत्साहका साथ त्यहाँ आउन थाले।

एक महिनापछि गाउँका शिक्षकले उनीहरूको प्रयासबारे थाहा पाए। उनले विद्यालयमा बैठक बोलाएर विद्यार्थी र अभिभावकलाई सहभागी गराए। गाउँका युवाहरूले बाटो मर्मत गर्ने जिम्मा लिए, आमा समूहले पानीको मुहान संरक्षणका लागि नियम बनायो र पसलेहरूले पसल अगाडि फोहोर फाल्न नदिने व्यवस्था गरे।

पहिले आलोचना गर्ने मानिसहरू पनि बिस्तारै सहयोगी बने। गाउँमा परिवर्तन देखिन थाल्यो।`,

end:`तीन महिनापछि शान्तिपुरको मुहान सफा थियो, बाटो पहिलेभन्दा सहज बनेको थियो र साना बालबालिकाले नियमित पढ्ने बानी बसालिसकेका थिए।

विद्यालयको कार्यक्रममा प्रधानाध्यापकले आर्यन र उसका साथीहरूलाई सम्मान गरे।

आर्यनले पुरस्कार ग्रहण गर्दै भन्यो, “यो काम हामी चार जनाको मात्र होइन। हामीले सुरु गरेको सानो प्रयासमा सबै गाउँले जोडिनुभयो, त्यसैले परिवर्तन सम्भव भयो।”

उसले भन्यो, “यो सानो नमुना हो। यसलाई अझ राम्रो बनाउन अनुसन्धान र विशेषज्ञको सल्लाह आवश्यक छ। तर वर्षाको पानी खेर जान नदिने सोचले हाम्रो गाउँमा उपयोगी काम गर्न सक्छ।”

प्रधानाध्यापकले उसको इमानदार प्रस्तुति र मेहनतको प्रशंसा गरे।

नवीनले पुरस्कारभन्दा ठूलो कुरा सिकेको थियो—समस्या देखेपछि समाधान खोज्न सकिन्छ, तर त्यसका लागि अध्ययन, परीक्षण, सुरक्षा र निरन्तर सुधार आवश्यक हुन्छ।

उसले भविष्यमा वातावरण र समुदायका लागि उपयोगी प्रविधि विकास गर्ने लक्ष्य बनायो।

**शिक्षा:** असफलताबाट सिक्दै निरन्तर प्रयास गरे नयाँ आविष्कार सम्भव हुन्छ।`
},

{
title:"इमानदारीको पुरस्कार",

बजारमा मानिसहरूको चहलपहल थियो। कोही तरकारी बेचिरहेका थिए, कोही कपडा किन्दै थिए र पसलहरूमा ग्राहकको भीड थियो।

सामान किनेर फर्कने क्रममा रविले बाटोछेउमा एउटा सानो पर्स देख्यो। उसले पर्स उठाएर वरिपरि हेर्‍यो, तर त्यसको मालिक कोही देखिएन।`,

middle:`रविले पर्स खोलेर हेर्दा केही पैसा, एउटा परिचयपत्र र एउटा पुरानो फोटो भेट्टायो।

रविले परिचयपत्रमा लेखिएको नाम पढ्यो। उसलाई त्यो व्यक्ति चिनेको थिएन, त्यसैले उसले नजिकैको प्रहरी सहायता कक्ष वा बजार व्यवस्थापन समितिको सहयोग लिनुपर्ने सोच्यो।

त्यही बेला उसका दुई साथी भेटिए।

उनीहरूले पर्समा पैसा भएको देखेपछि भने, “यति पैसा भेटिएको छ, कसैले थाहा पाउँदैन होला। राखे पनि हुन्छ।”

रविले शान्त स्वरमा भन्यो, “हामीले नभेटेको भए त्यो पैसा कसैको काममा लागिरहेको हुन्थ्यो। हराउने मानिसलाई कति चिन्ता भएको होला!”

साथीहरू केही बेर चुप लागे।

रवि आमासँगै बजार व्यवस्थापन समितिको कार्यालयमा गयो। त्यहाँका जिम्मेवार व्यक्तिले परिचयपत्रको विवरण हेरेर पर्स हराएको सूचना आएको छ कि छैन भनेर जाँच गरे।

केही समयपछि एक जना वृद्ध व्यक्ति चिन्तित हुँदै त्यहाँ आइपुगे। उनले आफ्नो पर्स हराएको बताए।

end:`त्यो घटनाबारे बजारका मानिसहरूले थाहा पाए। विद्यालयमा पनि शिक्षकले रविको उदाहरण सुनाए।

रविका साथीहरूले पनि आफ्नो गल्ती महसुस गरे। उनीहरूले रविसँग माफी मागे र भविष्यमा अरूको सामान भेटेमा सुरक्षित रूपमा सम्बन्धित व्यक्तिलाई फिर्ता गर्न सहयोग गर्ने वाचा गरे।

रविले कुनै ठूलो पुरस्कार पाएन, तर उसले मानिसहरूको विश्वास र आत्मसन्तुष्टि पायो।

उसले बुझ्यो—इमानदारीले समाजमा भरोसा बढाउँछ, र सानो सही निर्णयले पनि कसैको जीवनमा ठूलो राहत पुर्‍याउन सक्छ।

const storyData = [];

categories.forEach((category, ci) => {
  for(let i=0;i<100;i++){
    const sample = samples[(i+ci)%samples.length];
    const number = i+1;

    storyData.push({
      id:category+"-"+number,
      category:category,
      title:sample.title+" — "+category+" "+number,
      intro:sample.intro,
      middle:sample.middle,
      end:sample.end,
      full:
        sample.intro+"\n\n"+
        sample.middle+"\n\n"+
        sample.end
    });
  }
});

let activeCategory="सबै कथा";
let favorites=JSON.parse(localStorage.getItem("ajStoryFavorites")||"[]");
let favoriteMode=false;

function toggleThemes(){
  document.getElementById("themeOptions").classList.toggle("show");
}

function setTheme(theme){
  document.body.className=theme;
  localStorage.setItem("ajStoryTheme",theme);
  document.getElementById("themeOptions").classList.remove("show");
}

const savedTheme=localStorage.getItem("ajStoryTheme");
if(savedTheme!==null) document.body.className=savedTheme;

function renderCategories(){
  const box=document.getElementById("categories");
  const all=["सबै कथा",...categories];

  box.innerHTML=all.map(cat=>`
    <button class="cat-btn ${activeCategory===cat?"active":""}"
      onclick="selectCategory('${cat}')">${cat==="सबै कथा"?"📚 ":""}${cat}</button>
  `).join("");
}

function selectCategory(category){
  activeCategory=category;
  favoriteMode=false;
  renderCategories();
  renderStories();
}

function showFavorites(){
  favoriteMode=true;
  activeCategory="मनपर्ने";
  renderCategories();
  renderStories();
}

function toggleFavorite(id){
  if(favorites.includes(id)){
    favorites=favorites.filter(x=>x!==id);
  }else{
    favorites.push(id);
  }

  localStorage.setItem("ajStoryFavorites",JSON.stringify(favorites));
  renderStories();
}

function renderStories(){
  const grid=document.getElementById("storyGrid");
  const query=document.getElementById("searchInput").value.trim().toLowerCase();

  let list=storyData.filter(story=>{
    const categoryMatch=
      activeCategory==="सबै कथा" ||
      activeCategory==="मनपर्ने" ||
      story.category===activeCategory;

    const favoriteMatch=
      !favoriteMode || favorites.includes(story.id);

    const searchMatch=
      story.title.toLowerCase().includes(query) ||
      story.full.toLowerCase().includes(query) ||
      story.category.toLowerCase().includes(query);

    return categoryMatch && favoriteMatch && searchMatch;
  });

  document.getElementById("storyCount").textContent=
    "📖 "+list.length+" वटा कथा भेटिए";

  if(list.length===0){
    grid.innerHTML=`<div class="empty">😔 कुनै कथा भेटिएन।</div>`;
    return;
  }

  grid.innerHTML=list.map(story=>`
    <article class="story-card">
      <div class="story-top">
        <span class="story-category">${story.category}</span>
        <button class="heart"
          onclick="toggleFavorite('${story.id}')"
          title="मनपर्नेमा राख्नुहोस्">
          ${favorites.includes(story.id)?"❤️":"🤍"}
        </button>
      </div>

      <h3>📘 ${story.title}</h3>
      <p>${story.intro} ${story.middle}</p>

      <button class="read-btn"
        onclick="openStory('${story.id}')">
        📖 पूरा कथा पढ्नुहोस्
      </button>
    </article>
  `).join("");
}

function openStory(id){
  const story=storyData.find(s=>s.id===id);
  if(!story)return;

  document.getElementById("modalTitle").textContent=story.title;
  document.getElementById("modalStory").textContent=story.full;
  document.getElementById("storyModal").classList.add("show");
  document.body.style.overflow="hidden";
}

function closeModal(){
  document.getElementById("storyModal").classList.remove("show");
  document.body.style.overflow="";
}

function closeOutside(event){
  if(event.target.id==="storyModal") closeModal();
}

renderCategories();
renderStories();

</script>
